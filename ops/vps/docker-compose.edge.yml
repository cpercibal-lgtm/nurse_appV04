# The always-on part of the VPS (decision D-57): Caddy (HTTPS on 80/443,
# certificates from Let's Encrypt, renewed automatically) and ClamAV, shared
# by both release colours. Started by deploy.sh; do not run by hand except for
# diagnosis. Settings: /etc/nurseapp/deploy.env (SITE_HOST, ACME_EMAIL).

# Both images are pinned by digest (QA F2): the tag says which release, the digest which exact image;
# Dependabot (/ops/vps) moves them together. ClamAV's signatures are not part of the image: freshclam
# updates them in /srv/nurseapp/clamav, so a pinned engine still has current definitions.

name: nurseapp-edge

services:
  caddy:
    image: caddy:2.11@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]   # the only published ports on the VPS
    environment:
      SITE_HOST: ${SITE_HOST:?set SITE_HOST in /etc/nurseapp/deploy.env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in /etc/nurseapp/deploy.env}
      CADDY_GLOBAL_EXTRA: ${CADDY_GLOBAL_EXTRA:-}
    volumes:
      # Caddyfile (copied from this folder by deploy.sh) and site/upstream.caddy (which colour is
      # live), both replaced atomically, then `caddy reload` — graceful, no request dropped. A folder
      # is mounted, not the files, so a replaced file is seen and a new Caddyfile never recreates Caddy.
      - ${NURSEAPP_STATE:-/srv/nurseapp}/caddy/etc:/etc/caddy:ro
      - ${NURSEAPP_STATE:-/srv/nurseapp}/caddy/data:/data
      - ${NURSEAPP_STATE:-/srv/nurseapp}/caddy/config:/config
    networks:
      nurseapp: { ipv4_address: 172.30.0.2 }   # the web containers trust X-Client-Ip only from this address
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]

  clamav:
    image: clamav/clamav:1.5@sha256:ebec5bc138401b36ae987caa1a3fa3c3b2a21ed3d51f0bfa5852825e663e67b0
    environment:
      FRESHCLAM_CHECKS: "12"   # signature checks per day (image default 1 = signatures up to a day old; go-live-check wants ≤ 24 h)
    restart: unless-stopped
    volumes:
      - ${NURSEAPP_STATE:-/srv/nurseapp}/clamav:/var/lib/clamav   # signatures survive restarts; freshclam in the container updates them
    networks: [nurseapp]

networks:
  nurseapp:
    external: true   # created once by setup-host.sh: 172.30.0.0/24, containers get .128–.255, so the fixed .2 (Caddy) never clashes
