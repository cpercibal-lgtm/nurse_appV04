<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 356 624" width="356" height="624" role="img" aria-label="How an announcement reaches staff" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="178" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">How an announcement reaches staff</text><rect x="18" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Announcement sent</text><polyline points="178,103 178,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="131" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="168" text-anchor="middle" font-size="13" fill="#1f2933">Staff with an account: in-app notice and the</text><text x="178" y="185" text-anchor="middle" font-size="13" fill="#1f2933">Announcements board</text><polyline points="178,203 178,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="231" width="320" height="89" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="251" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="268" text-anchor="middle" font-size="13" fill="#1f2933">E-mail copy with the full text (security</text><text x="178" y="285" text-anchor="middle" font-size="13" fill="#1f2933">e-mail first; at most EMAIL_HOURLY_LIMIT an</text><text x="178" y="302" text-anchor="middle" font-size="13" fill="#1f2933">hour)</text><polyline points="178,320 178,348" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="348" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="368" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="385" text-anchor="middle" font-size="13" fill="#1f2933">Telegram, if linked: a short prompt only —</text><text x="178" y="402" text-anchor="middle" font-size="13" fill="#1f2933">never the content</text><polyline points="178,420 178,448" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="448" width="320" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="178" y="468" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="178" y="485" text-anchor="middle" font-size="13" fill="#1f2933">Staff without an account: the e-mail only,</text><text x="178" y="502" text-anchor="middle" font-size="13" fill="#1f2933">at their contact address</text><polyline points="178,520 178,548" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="18" y="548" width="320" height="58" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="178" y="571" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Removed from the board after its date; kept</text><text x="178" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">in Archived</text></svg>
