<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 962" width="554" height="962" role="img" aria-label="Building and publishing a roster" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="277" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Building and publishing a roster</text><rect x="117" y="48" width="320" height="55" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="277" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Scheduling: select the unit and the week</text><polyline points="277,103 277,131" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="131" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="151" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="168" text-anchor="middle" font-size="13" fill="#1f2933">Read each cell: eligible staff / target,</text><text x="277" y="185" text-anchor="middle" font-size="13" fill="#1f2933">shortage</text><polyline points="277,203 277,231" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="231" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="251" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="268" text-anchor="middle" font-size="13" fill="#1f2933">+ : pick from the eligible pool (live check</text><text x="277" y="285" text-anchor="middle" font-size="13" fill="#1f2933">for that date)</text><polyline points="277,303 277,331" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="331" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="351" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="368" text-anchor="middle" font-size="13" fill="#1f2933">Or Auto-fill: preview, then create drafts</text><polyline points="277,386 277,414" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="414" width="320" height="55" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="434" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="451" text-anchor="middle" font-size="13" fill="#1f2933">Resolve gaps and red (ineligible) drafts</text><polyline points="277,469 277,497" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="497" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="517" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="534" text-anchor="middle" font-size="13" fill="#1f2933">Ask for approval (Supervisor or Nursing</text><text x="277" y="551" text-anchor="middle" font-size="13" fill="#1f2933">Admin)</text><polyline points="277,569 277,597" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="597" width="320" height="89" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="617" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="634" text-anchor="middle" font-size="13" fill="#1f2933">The Nursing Director approves the week (a</text><text x="277" y="651" text-anchor="middle" font-size="13" fill="#1f2933">rejection gives a reason: change the drafts</text><text x="277" y="668" text-anchor="middle" font-size="13" fill="#1f2933">and ask again)</text><polyline points="277,686 277,714" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="714" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="734" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="751" text-anchor="middle" font-size="13" fill="#1f2933">Publish week (changing a draft after</text><text x="277" y="768" text-anchor="middle" font-size="13" fill="#1f2933">approval withdraws it)</text><polyline points="277,786 277,814" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="814" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="277" y="837" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Each draft re-checked</text><polyline points="277,855 277,869 143,869 143,903" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="112.4" y="872" width="61.2" height="16" rx="3" fill="#ffffff"/><text x="143" y="884" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Eligible</text><rect x="18" y="903" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="143" y="926" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Published (visible to the nurse)</text><polyline points="277,855 277,869 411,869 411,903" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="374" y="872" width="74" height="16" rx="3" fill="#ffffff"/><text x="411" y="884" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">Ineligible</text><rect x="286" y="903" width="250" height="41" rx="18" fill="#fdecec" stroke="#b3261e" stroke-width="1.4"/><text x="411" y="926" text-anchor="middle" font-size="13" fill="#7a1712">Stays Draft, with the reasons</text></svg>
