<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 554 496" width="554" height="496" role="img" aria-label="Sending an announcement" font-family="Segoe UI, Arial, Helvetica, sans-serif"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7b8d85"/></marker></defs><rect width="100%" height="100%" fill="#ffffff" rx="10"/><text x="277" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#0f3024">Sending an announcement</text><rect x="117" y="48" width="320" height="72" rx="18" fill="#e6f4ea" stroke="#1f6b4f" stroke-width="1.4"/><text x="277" y="68" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="85" text-anchor="middle" font-size="13" fill="#0f3024">Announcements → New announcement: type,</text><text x="277" y="102" text-anchor="middle" font-size="13" fill="#0f3024">text, audience</text><polyline points="277,120 277,148" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="148" width="320" height="72" rx="8" fill="#ffffff" stroke="#9fb3aa" stroke-width="1.4"/><text x="277" y="168" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SUPERVISOR</text><text x="277" y="185" text-anchor="middle" font-size="13" fill="#1f2933">Preview: who receives it, e-mail-only staff,</text><text x="277" y="202" text-anchor="middle" font-size="13" fill="#1f2933">delivery time</text><polyline points="277,220 277,248" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="117" y="248" width="320" height="41" rx="4" fill="#fff4dc" stroke="#d99a1e" stroke-width="2" stroke-dasharray="5 3"/><text x="277" y="271" text-anchor="middle" font-size="13" font-weight="600" fill="#5c3d00">Who is sending, to whom?</text><polyline points="277,289 277,303 143,303 143,337" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="35.599999999999994" y="306" width="214.8" height="16" rx="3" fill="#ffffff"/><text x="143" y="318" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">A Supervisor, to their own units</text><rect x="18" y="337" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="143" y="360" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Sent at once</text><polyline points="277,289 277,303 411,303 411,337" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="271.6" y="306" width="278.8" height="16" rx="3" fill="#ffffff"/><text x="411" y="318" text-anchor="middle" font-size="11" font-weight="600" fill="#5b6660">An HR Admin or System Admin (any audience)</text><rect x="286" y="337" width="250" height="72" rx="8" fill="#eef3f8" stroke="#7d9cc0" stroke-width="1.4"/><text x="411" y="357" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="0.6" fill="#5b6660">SYSTEM</text><text x="411" y="374" text-anchor="middle" font-size="13" fill="#1f2933">PENDING in Approvals: a second</text><text x="411" y="391" text-anchor="middle" font-size="13" fill="#1f2933">administrator approves</text><polyline points="411,409 411,437" fill="none" stroke="#7b8d85" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="286" y="437" width="250" height="41" rx="18" fill="#1f6b4f" stroke="#1f6b4f" stroke-width="1.4"/><text x="411" y="460" text-anchor="middle" font-size="13" font-weight="600" fill="#ffffff">Sent after approval</text></svg>
