# Dependabot: weekly pull requests for outdated dependencies (security fixes come
# as soon as an advisory is published, when "Dependabot security updates" is on).
# Minor and patch updates are grouped per ecosystem to keep the number of pull
# requests small; every pull request runs CI before it can be merged.
#
# Not proposed (ignore rules below): new major versions of Node, its type
# definitions and TypeScript, and nginx mainline releases. These move on purpose,
# with testing, not as routine bumps (docs/GITHUB_SECURITY.md §5). Security
# updates are not affected by ignore rules for version updates.
version: 2
updates:
  - package-ecosystem: npm            # the workspace: root, backend, frontend (one lockfile)
    directory: /
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Asia/Riyadh }
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Must match the Node version the images run (22 LTS); moves with Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the rewritten compiler: a planned upgrade, not a bump.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: npm            # the HTTPS session test (ops/e2e)
    directory: /ops/e2e
    schedule: { interval: monthly }
    groups:
      e2e:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Asia/Riyadh }
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies]

  - package-ecosystem: docker         # base images of the API and web images
    directories: [/backend, /frontend]
    schedule: { interval: weekly, day: sunday, time: "06:00", timezone: Asia/Riyadh }
    ignore:
      # Production stays on a Node LTS line: 22 now, 24 as a planned move before
      # 22's end of life (April 2027). Odd majors (23, 25, …) are never LTS.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      # nginx odd minor versions are the mainline (development) line; even ones are stable.
      - dependency-name: "nginx"
        versions: [">= 1.29, < 1.30", ">= 1.31, < 1.32", ">= 1.33, < 1.34", ">= 1.35, < 1.36", ">= 1.37, < 1.38", ">= 1.39, < 1.40"]
    labels: [dependencies]
