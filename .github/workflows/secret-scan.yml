name: Secret scan

# Gitleaks looks for passwords, keys and tokens in the commits of every push to
# main and every pull request. GitHub's own secret scanning and push protection
# are not available for a private repository on a personal account (they need
# GitHub Team or Enterprise with Secret Protection), so this is the stand-in.
# Free for repositories owned by a personal account (an organization needs a
# GITLEAKS_LICENSE secret). Make "gitleaks" a required status check on main.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
