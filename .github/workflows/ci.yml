name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: aigh
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: nurseapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aigh"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://aigh:ci_password@localhost:5432/nurseapp_test
      TEST_DATABASE_URL: postgresql://aigh:ci_password@localhost:5432/nurseapp_test
      NODE_ENV: test
      # Test-only signing key (CI never issues real sessions).
      JWT_SECRET: ci-only-test-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The custom-output Prisma client is not tracked and is not produced by
      # npm ci on a fresh checkout.
      - name: Generate Prisma client
        run: npm run db:generate -w backend
      - name: Apply migrations, then verify deployment is idempotent
        run: |
          npm run db:deploy -w backend
          npm run db:deploy -w backend
      # No seed: the database is database-first. The tests create their own
      # rows, and test/database-first.test.ts, bootstrap.test.ts and
      # fixtures.test.ts each build a brand-new database (migrate deploy only),
      # then bootstrap, import the hospital baseline or load demo fixtures.
      - run: npm run typecheck
      - run: npm test    # backend, frontend, documentation links
      - name: Build backend
        run: npm run build -w backend
      - name: Build frontend (includes the gzipped bundle budget gate)
        # The job's NODE_ENV=test is needed for DB integration tests. A Vite
        # build with NODE_ENV=test bundles development dependencies and exceeds
        # the production budget even though its production build passes.
        env:
          NODE_ENV: production
        run: npm run build -w frontend

  # Spec §11.3: the FHIR resources the API serves (spec §14.1, D-61) must pass
  # the HL7 FHIR R4 validator. The samples are built by the same mapping code;
  # terminology checks are off (-tx n/a: the codes are the hospital's own).
  fhir-validate:
    runs-on: ubuntu-24.04
    env:
      VALIDATOR_VERSION: 6.10.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache the validator and the R4 core package
        uses: actions/cache@v6
        with:
          path: |
            validator_cli.jar
            ~/.fhir/packages
          key: fhir-validator-${{ env.VALIDATOR_VERSION }}
      - name: Write the sample resources
        run: npx tsx backend/test/fixtures/fhir-samples.ts fhir-samples
      - name: HL7 FHIR R4 validator
        run: |
          [ -f validator_cli.jar ] || curl -fsSL -o validator_cli.jar "https://github.com/hapifhir/org.hl7.fhir.core/releases/download/${VALIDATOR_VERSION}/validator_cli.jar"
          java -jar validator_cli.jar fhir-samples/*.json -version 4.0.1 -tx n/a

  # The release images (ops/gcp, D-49) must keep building; nothing is pushed
  # here. They are then tested as deployed: the HTTPS browser test of the
  # session cookies (B-03, ops/e2e/README.md).
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: docker buildx build --load -f backend/Dockerfile --target runtime -t nurseapp/api:ci .
      - run: docker buildx build --load -f backend/Dockerfile --target migrate -t nurseapp/migrate:ci .
      - run: docker buildx build --load -f frontend/Dockerfile -t nurseapp/web:ci .
      # The tests a release image must pass live in one place; Deploy (VPS) runs the same action on the images it ships (F2).
      - uses: ./.github/actions/test-release-images
        with:
          tag: ci
