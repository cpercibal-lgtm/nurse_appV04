# Development database for AIGH Nursing Workforce V04.
#   docker compose up -d db
# PostgreSQL 15 is the production target (spec §0.2, backup drill verified on 15.19).
# Production containers (api, worker, web, clamav) are in ops/gcp/docker-compose.yml (D-49).
#
# Optional ClamAV daemon for UPLOAD_SCANNER=clamav (spec §5.3.2):
#   docker compose --profile clamav up -d clamav
# First start downloads the signatures (a few minutes; needs outbound internet),
# and freshclam inside the container keeps them current.

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aigh
      POSTGRES_PASSWORD: aigh_dev_only
      POSTGRES_DB: nurseapp
    ports:
      - "127.0.0.1:5432:5432"   # this computer only: the password above is a published dev default
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aigh -d nurseapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  clamav:
    image: clamav/clamav:1.4
    environment:
      FRESHCLAM_CHECKS: "12"   # signature checks per day (image default 1 = signatures up to a day old; go-live-check wants ≤ 24 h)
    profiles: ["clamav"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:3310:3310"
    volumes:
      - clamavdb:/var/lib/clamav

volumes:
  pgdata:
  clamavdb:
